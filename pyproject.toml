[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "shift-optimizer"
version = "0.1.0"
description = "Hourly shift assignment for casino tables (OR-Tools CP-SAT)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ortools>=9.14",
    "pandas>=2.0",
    "numpy>=1.26",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
shift-optimizer = "shift_optimizer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
